<div class="min-h-screen bg-gray-50">
  <div 
    *ngIf="isSidebarOpen" 
    (click)="toggleSidebar()" 
    class="fixed inset-0 bg-black/40 z-30 md:hidden transition-opacity">
  </div>

  <aside
    [class.translate-x-0]="isSidebarOpen"
    [class.-translate-x-full]="!isSidebarOpen"
    class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 shadow-sm z-40 transform transition-transform duration-300 ease-in-out md:translate-x-0">
    
    <div class="h-full flex flex-col">
      <div class="p-6 border-b">
        <h1 class="font-bold text-xl text-gray-800">Mi App</h1>
      </div>

      <app-sidebar-nav class="p-3 flex-grow"></app-sidebar-nav>

      <div class="p-4 border-t">
        <button
          (click)="logout()"
          class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="md:ml-64 flex flex-col min-h-screen">
    
    <header class="md:hidden flex items-center justify-between bg-white px-6 py-4 border-b">
      <span class="font-bold text-gray-800">Panel</span>
      <button (click)="toggleSidebar()" class="p-2 rounded-md hover:bg-gray-100 focus:outline-none">
        ☰
      </button>
    </header>

    <main class="p-6 max-w-7xl w-full mx-auto">
      <div class="grid grid-cols-1 gap-6">
        <section class="col-span-1">
          <router-outlet></router-outlet>
        </section>
      </div>
    </main>
  </div>
</div>
